&gt;&lt;u&gt;Isabelle Cossette&lt;/u&gt;&lt;/a&gt;. My research interests center around &lt;a href=&quot;https://nime.org/&quot; target=&quot;_blank&quot;&gt;&lt;u&gt;New Interfaces for Musical Expression (NIME)&lt;/u&gt;&lt;/a&gt;, with a particular focus on musical haptics and embodied interaction. I aim to use sensor technology and haptics to facilitate a shared kinesthetic music experience among diverse individuals. I have worked as a research intern in Yamaha with &lt;a href=&quot;https://www.yamaha.com/en/tech-design/research/student/akiramaezawa/&quot; target=&quot;_blank&quot;&gt;&lt;u&gt;Akira Maezawa&lt;/u&gt;&lt;/a&gt; and Yohei Wada and Sony CSL with &lt;a href=&quot;https://www.sonycsl.co.jp/en/people/shinichi-furuya/profile/&quot; target=&quot;_blank&quot;&gt;&lt;u&gt;Shinichi Furuya&lt;/u&gt;&lt;/a&gt; and &lt;a href=&quot;https://junis.sakura.ne.jp/wp/&quot; target=&quot;_blank&quot;&gt;&lt;u&gt;Jun Nishida&lt;/u&gt;&lt;/a&gt;. I have also worked as a research assistant with &lt;a href=&quot;http://www.musicxlab.com/members/gus/&quot; target=&quot;_blank&quot;&gt;&lt;u&gt;Gus Xia&lt;/u&gt;&lt;/a&gt; at &lt;a href=&quot;http://www.musicxlab.com/&quot; target=&quot;_blank&quot;&gt;&lt;u&gt;Music X Lab&lt;/u&gt;&lt;/a&gt;, New York University Shanghai, &lt;a href=&quot;https://www.cs.cmu.edu/~rbd/&quot; target=&quot;_blank&quot;&gt;&lt;u&gt;Roger Dannenberg&lt;/u&gt;&lt;/a&gt; at Carnegie Mellon University, and &lt;a href=&quot;https://recherche.umontreal.ca/english/our-researchers/professors-directory/researcher/is/in32013/&quot; target=&quot;_blank&quot;&gt;&lt;u&gt;Felipe Verdugo&lt;/u&gt;&lt;/a&gt; at University of Montreal. Besides, I was a student representative for &lt;a href=&quot;https://www.cirmmt.org/en&quot; target=&quot;_blank&quot;&gt;&lt;u&gt;CIRMMT&lt;/u&gt;&lt;/a&gt; and &lt;a href=&quot;https://www.ieee-ras.org/haptics&quot; target=&quot;_blank&quot;&gt;&lt;u&gt;IEEE Technical Committee for Haptics&lt;/u&gt;&lt;/a&gt;. As a classically trained soprano, I enjoy performing art songs. In my leisure time, I engage in activities such as video games 🎮, photography 📷, delicacies 🍲, and yoga 🧘. Feel free to connect with me on LinkedIn or email me!"/><link rel="icon" href="/namelogo1.ico"/><script src="/_next/static/chunks/polyfills-42372ed130431b0a.js" noModule=""></script></head><body class="__variable_246ccd __variable_4c40f6 __variable_97918b __variable_7dbc8c antialiased"><main class=""><div style="font-family:system-ui,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif,&quot;Apple Color Emoji&quot;,&quot;Segoe UI Emoji&quot;;height:100vh;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center"><div><style>body{color:#000;background:#fff;margin:0}.next-error-h1{border-right:1px solid rgba(0,0,0,.3)}@media (prefers-color-scheme:dark){body{color:#fff;background:#000}.next-error-h1{border-right:1px solid rgba(255,255,255,.3)}}</style><h1 class="next-error-h1" style="display:inline-block;margin:0 20px 0 0;padding:0 23px 0 0;font-size:24px;font-weight:500;vertical-align:top;line-height:49px">404</h1><div style="display:inline-block"><h2 style="font-size:14px;font-weight:400;line-height:49px;margin:0">This page could not be found.</h2></div></div></div></main><footer class="border-t border-neutral-200 dark:border-neutral-800 bg-[#FFFCF8]"><div class="flex flex-row mx-auto max-w-7xl px-6 py-12 md:flex md:items-start md:justify-between "><div class="mb-4 text-sm text-neutral-600 dark:text-neutral-400"><div class="mb-4 text-sm text-neutral-600 dark:text-neutral-400"><a href="https://clustrmaps.com/site/1blfr" title="Visit tracker">© <!-- -->2026<!-- --> <!-- -->Ziyue (Monica) Piao<!-- -->.</a><img src="http://www.clustrmaps.com/map_v2.png?d=AOpTLz458w686Jm6qaHPabvrYzxp7Ln5KHnZCxykHig&amp;cl=ffffff" alt="ClustrMaps Tracker" style="display:none"/></div></div><div class="mb-4"><p class="text-sm text-neutral-500 dark:text-neutral-500 justify">Built with<!-- --> <a href="
